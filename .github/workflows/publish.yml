name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version eCervo approuvée à publier'
        required: true
        type: string

permissions:
  id-token: write # required for OIDC → npm
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Vérifier le paquet et le tag approuvés
        env:
          APPROVED_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const p = require("./package.json"); if (p.name !== "@ecervo/pdf-lib" || p.version !== process.env.APPROVED_VERSION || process.env.GITHUB_REF !== "refs/tags/v" + p.version) process.exit(1)'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # Never cache package manager state for release builds.
          package-manager-cache: false

      - name: Use npm with OIDC support
        run: npm install -g npm@latest

      - name: Enable Corepack (Yarn classic)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Publier @ecervo/pdf-lib
        run: npm publish --access public
